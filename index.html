<!DOCTYPE html>
<html lang="zh-CN" data-theme="light" data-market-color="cn">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>零基础投资冒险学院 · ELI5 大白话交互金融实验室</title>
  <style>
/* ==========================================================================
   零基础投资冒险学院（InvestELI5 Academy）设计系统
   设计理念：温暖可读的纸张底色 + 清晰的层次 + 柔和的金融情绪语义色
   ========================================================================== */

:root {
  /* 基础色彩（浅色模式） */
  --bg-app: #f6f4ef;
  --bg-surface: #ffffff;
  --bg-subtle: #f1eee7;
  --bg-elevated: #ffffff;
  --bg-code: #f3f4f6;

  --text-primary: #18202c;
  --text-secondary: #4a5568;
  --text-muted: #718096;
  --text-inverse: #ffffff;

  --border-color: #e4dfd5;
  --border-strong: #cfc8ba;

  /* 品牌与语义色 */
  --brand: #4338ca;
  --brand-soft: #eef2ff;
  --brand-hover: #3730a3;

  --eli5-bg: #fffbeb;
  --eli5-border: #fcd34d;
  --eli5-accent: #b45309;

  --bridge-bg: #eef2ff;
  --bridge-border: #a5b4fc;
  --bridge-accent: #3730a3;

  --trap-bg: #fff1f2;
  --trap-border: #fda4af;
  --trap-accent: #be123c;

  --success: #059669;
  --success-soft: #ecfdf5;
  --warning: #d97706;
  --warning-soft: #fffbeb;
  --danger: #dc2626;
  --danger-soft: #fef2f2;

  /* 涨跌语义色（默认：中国 A 股习惯——红涨绿跌） */
  --market-up: #dc2626;
  --market-up-soft: #fef2f2;
  --market-down: #059669;
  --market-down-soft: #ecfdf5;

  /* 阴影与圆角 */
  --shadow-sm: 0 1px 2px rgba(24, 32, 44, 0.05);
  --shadow-md: 0 4px 16px rgba(24, 32, 44, 0.07);
  --shadow-lg: 0 14px 36px rgba(24, 32, 44, 0.14);

  --radius-sm: 8px;
  --radius-md: 14px;
  --radius-lg: 20px;
  --radius-pill: 999px;

  --sidebar-width: 288px;
  --topbar-height: 64px;
  --font-sans: -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", "Segoe UI", Roboto, sans-serif;
  --font-mono: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
}

/* 国际/美股配色习惯：绿涨红跌 */
[data-market-color="global"] {
  --market-up: #059669;
  --market-up-soft: #ecfdf5;
  --market-down: #dc2626;
  --market-down-soft: #fef2f2;
}

/* 深色模式 */
[data-theme="dark"] {
  --bg-app: #0f141d;
  --bg-surface: #171e2b;
  --bg-subtle: #1e2738;
  --bg-elevated: #202a3c;
  --bg-code: #253046;

  --text-primary: #edf2f7;
  --text-secondary: #a8b5c8;
  --text-muted: #7c8ca3;
  --text-inverse: #0f141d;

  --border-color: #29354a;
  --border-strong: #394863;

  --brand: #818cf8;
  --brand-soft: rgba(129, 140, 248, 0.14);
  --brand-hover: #6366f1;

  --eli5-bg: rgba(245, 158, 11, 0.11);
  --eli5-border: rgba(245, 158, 11, 0.35);
  --eli5-accent: #fbbf24;

  --bridge-bg: rgba(129, 140, 248, 0.12);
  --bridge-border: rgba(129, 140, 248, 0.35);
  --bridge-accent: #a5b4fc;

  --trap-bg: rgba(244, 63, 94, 0.12);
  --trap-border: rgba(244, 63, 94, 0.35);
  --trap-accent: #fda4af;

  --success: #34d399;
  --success-soft: rgba(52, 211, 153, 0.14);
  --warning: #fbbf24;
  --warning-soft: rgba(251, 191, 36, 0.14);
  --danger: #f87171;
  --danger-soft: rgba(248, 113, 113, 0.14);

  --market-up: #f87171;
  --market-up-soft: rgba(248, 113, 113, 0.15);
  --market-down: #34d399;
  --market-down-soft: rgba(52, 211, 153, 0.15);

  --shadow-sm: 0 1px 3px rgba(0, 0, 0, 0.28);
  --shadow-md: 0 6px 20px rgba(0, 0, 0, 0.35);
  --shadow-lg: 0 18px 40px rgba(0, 0, 0, 0.55);
}

[data-theme="dark"][data-market-color="global"] {
  --market-up: #34d399;
  --market-up-soft: rgba(52, 211, 153, 0.15);
  --market-down: #f87171;
  --market-down-soft: rgba(248, 113, 113, 0.15);
}

/* 全局重置 */
*, *::before, *::after {
  box-sizing: border-box;
}

html, body {
  margin: 0;
  padding: 0;
  font-family: var(--font-sans);
  background: var(--bg-app);
  color: var(--text-primary);
  line-height: 1.65;
  -webkit-font-smoothing: antialiased;
}

button, input, select {
  font-family: inherit;
  color: inherit;
}

button {
  cursor: pointer;
}

/* ==========================================================================
   应用主框架布局
   ========================================================================== */
.app-shell {
  display: flex;
  min-height: 100vh;
}

.sidebar {
  width: var(--sidebar-width);
  background: var(--bg-surface);
  border-right: 1px solid var(--border-color);
  display: flex;
  flex-direction: column;
  position: fixed;
  top: 0;
  bottom: 0;
  left: 0;
  z-index: 40;
  transition: transform 0.25s ease;
}

.sidebar-header {
  padding: 18px 18px 14px;
  border-bottom: 1px solid var(--border-color);
}

.brand-row {
  display: flex;
  align-items: center;
  gap: 10px;
}

.brand-logo {
  width: 38px;
  height: 38px;
  border-radius: 12px;
  background: linear-gradient(135deg, #4338ca, #7c3aed);
  color: #fff;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 20px;
  box-shadow: var(--shadow-sm);
  flex-shrink: 0;
}

.brand-title {
  font-size: 16px;
  font-weight: 800;
  line-height: 1.25;
}

.brand-sub {
  font-size: 11px;
  color: var(--text-muted);
}

.progress-widget {
  margin-top: 14px;
  padding: 10px 12px;
  background: var(--bg-subtle);
  border-radius: var(--radius-sm);
}

.progress-top {
  display: flex;
  justify-content: space-between;
  align-items: center;
  font-size: 12px;
  font-weight: 700;
  margin-bottom: 6px;
}

.rank-pill {
  color: var(--brand);
}

.progress-bar-track {
  height: 7px;
  background: var(--border-color);
  border-radius: var(--radius-pill);
  overflow: hidden;
}

.progress-bar-fill {
  height: 100%;
  background: linear-gradient(90deg, #4f46e5, #10b981);
  border-radius: var(--radius-pill);
  transition: width 0.4s ease;
}

.sidebar-nav {
  flex: 1;
  overflow-y: auto;
  padding: 12px 10px 24px;
}

.nav-section-label {
  font-size: 11px;
  font-weight: 700;
  text-transform: uppercase;
  letter-spacing: 0.06em;
  color: var(--text-muted);
  padding: 10px 10px 6px;
}

.nav-item {
  width: 100%;
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 9px 12px;
  border: none;
  background: transparent;
  border-radius: 10px;
  text-align: left;
  font-size: 13.5px;
  font-weight: 500;
  color: var(--text-secondary);
  transition: background 0.15s ease, color 0.15s ease;
  margin-bottom: 2px;
}

.nav-item:hover {
  background: var(--bg-subtle);
  color: var(--text-primary);
}

.nav-item.active {
  background: var(--brand-soft);
  color: var(--brand);
  font-weight: 700;
}

.nav-item .nav-badge {
  margin-left: auto;
  font-size: 11px;
  padding: 2px 7px;
  border-radius: var(--radius-pill);
  background: var(--bg-subtle);
  color: var(--text-muted);
}

.nav-item.active .nav-badge {
  background: var(--brand);
  color: #fff;
}

.nav-chapter-btn {
  width: 100%;
  display: flex;
  align-items: center;
  gap: 8px;
  padding: 8px 10px;
  border: none;
  background: transparent;
  border-radius: 10px;
  font-size: 13px;
  font-weight: 700;
  color: var(--text-primary);
  text-align: left;
  margin-top: 4px;
}

.nav-chapter-btn:hover {
  background: var(--bg-subtle);
}

.nav-lesson-list {
  padding-left: 14px;
  margin: 2px 0 6px;
  border-left: 2px solid var(--border-color);
  margin-left: 16px;
}

.nav-lesson-item {
  width: 100%;
  display: flex;
  align-items: center;
  gap: 7px;
  padding: 6px 10px;
  border: none;
  background: transparent;
  border-radius: 8px;
  font-size: 12.5px;
  color: var(--text-secondary);
  text-align: left;
  margin-bottom: 2px;
}

.nav-lesson-item:hover {
  background: var(--bg-subtle);
  color: var(--text-primary);
}

.nav-lesson-item.active {
  background: var(--brand-soft);
  color: var(--brand);
  font-weight: 700;
}

.lesson-dot {
  width: 16px;
  height: 16px;
  border-radius: 50%;
  border: 1.5px solid var(--border-strong);
  display: inline-flex;
  align-items: center;
  justify-content: center;
  font-size: 10px;
  flex-shrink: 0;
}

.lesson-dot.done {
  background: var(--success);
  border-color: var(--success);
  color: #fff;
}

/* 右侧主区 */
.main-area {
  flex: 1;
  margin-left: var(--sidebar-width);
  display: flex;
  flex-direction: column;
  min-width: 0;
}

.topbar {
  height: var(--topbar-height);
  background: var(--bg-surface);
  border-bottom: 1px solid var(--border-color);
  padding: 0 24px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
  position: sticky;
  top: 0;
  z-index: 30;
}

.topbar-left {
  display: flex;
  align-items: center;
  gap: 12px;
  min-width: 0;
}

.mobile-menu-btn {
  display: none;
  border: 1px solid var(--border-color);
  background: var(--bg-subtle);
  border-radius: 8px;
  padding: 6px 10px;
  font-size: 16px;
}

.breadcrumb {
  font-size: 13.5px;
  color: var(--text-secondary);
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.breadcrumb strong {
  color: var(--text-primary);
}

.topbar-actions {
  display: flex;
  align-items: center;
  gap: 8px;
  flex-shrink: 0;
}

.pill-btn {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  padding: 7px 12px;
  border-radius: var(--radius-pill);
  border: 1px solid var(--border-color);
  background: var(--bg-subtle);
  font-size: 12.5px;
  font-weight: 600;
  color: var(--text-primary);
  transition: all 0.15s ease;
}

.pill-btn:hover {
  border-color: var(--brand);
  color: var(--brand);
}

.content-container {
  max-width: 1040px;
  width: 100%;
  margin: 0 auto;
  padding: 28px 28px 72px;
}

/* ==========================================================================
   通用卡片与按钮组件
   ========================================================================== */
.card {
  background: var(--bg-surface);
  border: 1px solid var(--border-color);
  border-radius: var(--radius-md);
  padding: 22px;
  box-shadow: var(--shadow-sm);
}

.card + .card {
  margin-top: 18px;
}

.hero-card {
  background: linear-gradient(135deg, #312e81 0%, #4338ca 48%, #0f766e 100%);
  color: #ffffff;
  border: none;
  border-radius: var(--radius-lg);
  padding: 32px;
  box-shadow: var(--shadow-md);
  position: relative;
  overflow: hidden;
}

.hero-card p {
  color: rgba(255, 255, 255, 0.9);
  max-width: 680px;
}

.hero-tag {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  padding: 4px 12px;
  border-radius: var(--radius-pill);
  background: rgba(255, 255, 255, 0.18);
  font-size: 12px;
  font-weight: 700;
  margin-bottom: 12px;
}

.hero-title {
  margin: 0 0 10px;
  font-size: 28px;
  line-height: 1.25;
  font-weight: 800;
}

.btn {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 6px;
  padding: 10px 18px;
  border-radius: 10px;
  font-size: 14px;
  font-weight: 700;
  border: 1px solid transparent;
  transition: all 0.15s ease;
}

.btn-primary {
  background: var(--brand);
  color: #fff;
}

.btn-primary:hover {
  background: var(--brand-hover);
  transform: translateY(-1px);
}

.btn-white {
  background: #ffffff;
  color: #312e81;
}

.btn-white:hover {
  background: #eef2ff;
}

.btn-outline {
  background: transparent;
  border-color: var(--border-strong);
  color: var(--text-primary);
}

.btn-outline:hover {
  border-color: var(--brand);
  color: var(--brand);
}

.btn-ghost-light {
  background: rgba(255, 255, 255, 0.16);
  color: #fff;
  border-color: rgba(255, 255, 255, 0.3);
}

.btn-ghost-light:hover {
  background: rgba(255, 255, 255, 0.26);
}

.btn-sm {
  padding: 6px 12px;
  font-size: 12.5px;
  border-radius: 8px;
}

.grid-2 {
  display: grid;
  grid-template-columns: repeat(2, minmax(0, 1fr));
  gap: 16px;
}

.grid-3 {
  display: grid;
  grid-template-columns: repeat(3, minmax(0, 1fr));
  gap: 16px;
}

.grid-4 {
  display: grid;
  grid-template-columns: repeat(4, minmax(0, 1fr));
  gap: 14px;
}

/* ==========================================================================
   ELI5 三层教学块 & 术语胶囊
   ========================================================================== */
.eli5-box {
  background: var(--eli5-bg);
  border: 1.5px solid var(--eli5-border);
  border-radius: var(--radius-md);
  padding: 20px 22px;
  margin: 18px 0;
}

.eli5-box-title {
  display: flex;
  align-items: center;
  gap: 8px;
  font-size: 15px;
  font-weight: 800;
  color: var(--eli5-accent);
  margin: 0 0 8px;
}

.bridge-box {
  background: var(--bridge-bg);
  border: 1.5px solid var(--bridge-border);
  border-radius: var(--radius-md);
  padding: 20px 22px;
  margin: 18px 0;
}

.bridge-box-title {
  display: flex;
  align-items: center;
  gap: 8px;
  font-size: 15px;
  font-weight: 800;
  color: var(--bridge-accent);
  margin: 0 0 8px;
}

.trap-box {
  background: var(--trap-bg);
  border: 1.5px solid var(--trap-border);
  border-radius: var(--radius-md);
  padding: 18px 22px;
  margin: 18px 0;
}

.trap-box-title {
  display: flex;
  align-items: center;
  gap: 8px;
  font-size: 15px;
  font-weight: 800;
  color: var(--trap-accent);
  margin: 0 0 8px;
}

.glossary-term {
  display: inline;
  color: var(--brand);
  font-weight: 700;
  border-bottom: 1.5px dashed var(--brand);
  cursor: pointer;
  padding: 0 2px;
  border-radius: 4px;
  transition: background 0.15s ease;
}

.glossary-term:hover {
  background: var(--brand-soft);
}

/* 随堂小测验 */
.quiz-card {
  margin-top: 22px;
  background: var(--bg-subtle);
  border: 1px solid var(--border-color);
  border-radius: var(--radius-md);
  padding: 20px 22px;
}

.quiz-option {
  width: 100%;
  text-align: left;
  padding: 12px 15px;
  margin-top: 8px;
  border-radius: 10px;
  border: 1.5px solid var(--border-color);
  background: var(--bg-surface);
  font-size: 14px;
  display: flex;
  align-items: flex-start;
  gap: 10px;
  transition: all 0.15s ease;
}

.quiz-option:hover:not(:disabled) {
  border-color: var(--brand);
  background: var(--brand-soft);
}

.quiz-option.correct {
  border-color: var(--success);
  background: var(--success-soft);
}

.quiz-option.wrong {
  border-color: var(--danger);
  background: var(--danger-soft);
}

.quiz-feedback {
  margin-top: 12px;
  padding: 12px 14px;
  border-radius: 10px;
  font-size: 13.5px;
  line-height: 1.6;
}

.quiz-feedback.ok {
  background: var(--success-soft);
  color: var(--text-primary);
  border: 1px solid var(--success);
}

.quiz-feedback.err {
  background: var(--danger-soft);
  color: var(--text-primary);
  border: 1px solid var(--danger);
}

/* ==========================================================================
   互动实验室与指标组件
   ========================================================================== */
.lab-panel {
  background: var(--bg-surface);
  border: 1.5px solid var(--border-color);
  border-radius: var(--radius-md);
  padding: 22px;
  margin: 20px 0;
  box-shadow: var(--shadow-sm);
}

.lab-header {
  display: flex;
  align-items: flex-start;
  justify-content: space-between;
  gap: 12px;
  margin-bottom: 16px;
  flex-wrap: wrap;
}

.lab-badge {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  padding: 4px 10px;
  border-radius: var(--radius-pill);
  background: var(--brand-soft);
  color: var(--brand);
  font-size: 12px;
  font-weight: 700;
}

.control-group {
  margin-bottom: 14px;
}

.control-label {
  display: flex;
  justify-content: space-between;
  align-items: center;
  font-size: 13px;
  font-weight: 600;
  margin-bottom: 6px;
  color: var(--text-secondary);
}

.control-value {
  font-family: var(--font-mono);
  font-weight: 800;
  color: var(--brand);
  font-size: 14px;
}

input[type="range"] {
  -webkit-appearance: none;
  appearance: none;
  width: 100%;
  height: 7px;
  border-radius: var(--radius-pill);
  background: var(--border-color);
  outline: none;
}

input[type="range"]::-webkit-slider-thumb {
  -webkit-appearance: none;
  appearance: none;
  width: 20px;
  height: 20px;
  border-radius: 50%;
  background: var(--brand);
  border: 3px solid #fff;
  box-shadow: 0 2px 6px rgba(0, 0, 0, 0.25);
  cursor: pointer;
}

.stat-card {
  background: var(--bg-subtle);
  border: 1px solid var(--border-color);
  border-radius: 12px;
  padding: 14px 16px;
}

.stat-label {
  font-size: 12px;
  color: var(--text-muted);
  margin-bottom: 4px;
}

.stat-value {
  font-size: 20px;
  font-weight: 800;
  font-family: var(--font-mono);
  line-height: 1.25;
}

.stat-sub {
  font-size: 11.5px;
  color: var(--text-secondary);
  margin-top: 4px;
}

.text-up {
  color: var(--market-up);
}

.text-down {
  color: var(--market-down);
}

.bg-up {
  background: var(--market-up-soft);
  color: var(--market-up);
}

.bg-down {
  background: var(--market-down-soft);
  color: var(--market-down);
}

.chart-wrap {
  width: 100%;
  background: var(--bg-subtle);
  border: 1px solid var(--border-color);
  border-radius: 12px;
  padding: 14px;
  overflow: hidden;
}

.chart-legend {
  display: flex;
  flex-wrap: wrap;
  gap: 14px;
  font-size: 12px;
  color: var(--text-secondary);
  margin-bottom: 8px;
}

.legend-item {
  display: inline-flex;
  align-items: center;
  gap: 6px;
}

.legend-dot {
  width: 10px;
  height: 10px;
  border-radius: 3px;
  display: inline-block;
}

/* 场景切换标签 */
.seg-tabs {
  display: inline-flex;
  flex-wrap: wrap;
  gap: 6px;
  background: var(--bg-subtle);
  padding: 4px;
  border-radius: 10px;
  border: 1px solid var(--border-color);
}

.seg-tab {
  border: none;
  background: transparent;
  padding: 6px 12px;
  border-radius: 7px;
  font-size: 12.5px;
  font-weight: 600;
  color: var(--text-secondary);
}

.seg-tab.active {
  background: var(--bg-surface);
  color: var(--brand);
  box-shadow: var(--shadow-sm);
}

/* 表格 */
.data-table {
  width: 100%;
  border-collapse: collapse;
  font-size: 13.5px;
}

.data-table th, .data-table td {
  padding: 10px 12px;
  border-bottom: 1px solid var(--border-color);
  text-align: left;
}

.data-table th {
  font-size: 12px;
  color: var(--text-muted);
  font-weight: 700;
  background: var(--bg-subtle);
}

/* 弹窗 Modal（术语解释 & 毕业报告） */
.modal-backdrop {
  position: fixed;
  inset: 0;
  background: rgba(15, 20, 29, 0.56);
  backdrop-filter: blur(3px);
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 20px;
  z-index: 100;
  opacity: 0;
  pointer-events: none;
  transition: opacity 0.2s ease;
}

/**
 * 金融计算引擎（纯函数模块，方便浏览器运行与 Node 单元测试）
 * 所有公式均对应真实金融逻辑，同时输出便于 ELI5 白话解读的直观指标
 */

/**
 * 1. 复利与通货膨胀时光机计算
 */
function calcCompoundAndInflation({
  initial = 10000,
  monthly = 1000,
  annualReturnPct = 8,
  inflationPct = 3,
  years = 20,
  milkTeaPrice = 18
}) {
  const r = annualReturnPct / 100;
  const inf = inflationPct / 100;
  const monthlyRate = r / 12;

  const series = [];
  let investedNominal = initial;
  let totalPrincipal = initial;

  for (let y = 0; y <= years; y++) {
    const inflationFactor = Math.pow(1 + inf, y);
    const investedReal = investedNominal / inflationFactor;
    const cashReal = totalPrincipal / inflationFactor;

    series.push({
      year: y,
      principal: Math.round(totalPrincipal),
      investedNominal: Math.round(investedNominal),
      investedReal: Math.round(investedReal),
      cashReal: Math.round(cashReal),
      milkTeaPriceThen: +(milkTeaPrice * inflationFactor).toFixed(1)
    });

    if (y < years) {
      for (let m = 0; m < 12; m++) {
        investedNominal = investedNominal * (1 + monthlyRate) + monthly;
        totalPrincipal += monthly;
      }
    }
  }

  const last = series[series.length - 1];
  const nominalGain = last.investedNominal - last.principal;
  const inflationLossOnCash = last.principal - last.cashReal;
  const milkTeaCupsNow = Math.round(last.principal / milkTeaPrice);
  const milkTeaCupsCash = Math.round(last.cashReal / milkTeaPrice);
  const milkTeaCupsInvest = Math.round(last.investedReal / milkTeaPrice);

  return {
    series,
    summary: {
      totalPrincipal: last.principal,
      investedNominal: last.investedNominal,
      investedReal: last.investedReal,
      cashReal: last.cashReal,
      nominalGain,
      inflationLossOnCash,
      milkTeaPriceFuture: last.milkTeaPriceThen,
      milkTeaCupsNow,
      milkTeaCupsCash,
      milkTeaCupsInvest,
      rule72Years: annualReturnPct > 0 ? +(72 / annualReturnPct).toFixed(1) : Infinity
    }
  };
}

/**
 * 2. 街边奶茶店 IPO 与估值模拟器（PE / PB / ROE 直观化）
 */
function calcMilkTeaValuation({
  annualProfit = 20, // 万元
  growthRatePct = 15, // 年利润增速 %
  sentimentScore = 0, // -50(极度悲观) ~ 0(理性) ~ +50(狂热炒作)
  netAssets = 100, // 净资产（家当）万元
  totalShares = 10 // 万股
}) {
  // 理性市盈率锚：基础 10 倍 + 增速溢价（类似 PEG ≈ 1 的直觉）
  const fairPE = Math.max(6, Math.min(40, +(10 + growthRatePct * 0.65).toFixed(1)));
  // 市场情绪把估值拉偏：悲观打折，狂热溢价
  const sentimentMultiplier = 1 + (sentimentScore / 100) * 1.1;
  const marketPE = Math.max(3, +(fairPE * sentimentMultiplier).toFixed(1));

  const fairValue = +(annualProfit * fairPE).toFixed(1); // 万元
  const marketCap = +(annualProfit * marketPE).toFixed(1); // 万元
  const sharePrice = +(marketCap / totalShares).toFixed(2); // 元/股
  const fairSharePrice = +(fairValue / totalShares).toFixed(2); // 元/股
  const eps = +(annualProfit / totalShares).toFixed(2); // 每股收益
  const pb = +(marketCap / Math.max(1, netAssets)).toFixed(2); // 市净率
  const roe = +((annualProfit / Math.max(1, netAssets)) * 100).toFixed(1); // 净资产收益率 %
  const peg = growthRatePct > 0 ? +(marketPE / growthRatePct).toFixed(2) : null;

  const ratioToFair = marketCap / Math.max(1, fairValue);
  let verdict = '合理价格';
  let verdictTone = 'neutral';
  let eli5Advice = '大家给这家奶茶店的出价和它赚钱的速度差不多，既不算捡漏，也不算当冤大头。';

  if (ratioToFair < 0.78) {
    verdict = '打折甩卖（低估机会）';
    verdictTone = 'good';
    eli5Advice = `好机会！店里赚钱能力没变，只因为市场情绪悲观，别人愿意打 ${Math.round(ratioToFair * 10)} 折把股份卖给你，回本只要 ${marketPE} 年。`;
  } else if (ratioToFair > 1.35) {
    verdict = '疯狂泡沫（严重高估）';
    verdictTone = 'danger';
    eli5Advice = `危险警报！大家太狂热了，按现在这价格买，要等整整 ${marketPE} 年才靠利润回本！一旦热度退去，股价可能腰斩。`;
  } else if (ratioToFair > 1.15) {
    verdict = '偏贵区域（谨慎追高）';
    verdictTone = 'warning';
    eli5Advice = '店虽然不错，但价格已经透支了未来几年的好消息，这时候冲进去容易买在山顶。';
  }

  return {
    fairPE,
    marketPE,
    fairValue,
    marketCap,
    sharePrice,
    fairSharePrice,
    eps,
    pb,
    roe,
    peg,
    verdict,
    verdictTone,
    eli5Advice
  };
}

/**
 * 3. 股市走向四维罗盘与 K 线/拔河推演
 */
function calcMarketCompass({
  earnings = 20, // 企业盈利基本面 -100 ~ +100
  liquidity = 20, // 央行资金面 -100 ~ +100
  policy = 10, // 政策面 -100 ~ +100
  sentiment = 0 // 市场情绪面 -100 ~ +100
}) {
  // 权重：基本面 35%，资金面 30%，政策面 15%，情绪面 20%
  const composite = Math.round(
    earnings * 0.35 + liquidity * 0.30 + policy * 0.15 + sentiment * 0.20
  );

  // 市场温度计（0-100℃，情绪和资金权重偏高）
  const rawTemp = 50 + sentiment * 0.32 + liquidity * 0.12 + earnings * 0.08;
  const temperature = Math.max(5, Math.min(98, Math.round(rawTemp)));

  // 多空力量拔河比例（买方力量占比 %）
  const bullPower = Math.max(15, Math.min(85, Math.round(50 + composite * 0.36)));
  const bearPower = 100 - bullPower;

  let regime = '震荡整理市';
  let eli5Summary = '买的人和卖的人势均力敌，指数像在盒子里上下弹跳，适合耐心定投、高抛低吸，别频繁追涨杀跌。';
  let actionHint = '保持均衡仓位，继续按纪律定投宽基 ETF。';

  if (composite >= 45) {
    regime = temperature >= 78 ? '狂热加速牛市（警惕见顶）' : '健康主升浪牛市';
    eli5Summary =
      temperature >= 78
        ? '企业赚钱、钱也多，但街坊邻居都在疯抢股票（温度太高了！），就像气球吹得很大，越往后越要小心突然扎破。'
        : '企业利润在涨、市场不缺钱，大家信心慢慢恢复，这是股市最舒服的"顺风顺水期"。';
    actionHint =
      temperature >= 78
        ? '千万别在此时借钱加仓！可以分批把部分盈利落袋为安，转入债券或现金。'
        : '顺势持有优质宽基和成长资产，让利润奔跑。';
  } else if (composite >= 15) {
    regime = '温和慢牛 / 结构性上涨';
    eli5Summary = '整体风向偏暖，好公司慢慢涨，偶尔有小回调，像爬山一样走两步歇一步。';
    actionHint = '逢回调分批布局，重点看盈利稳健的宽基与行业龙头。';
  } else if (composite <= -40) {
    regime = temperature <= 25 ? '恐慌出清底部区（别人恐惧）' : '主跌浪熊市';
    eli5Summary =
      temperature <= 25
        ? '坏消息满天飞，大家吓得甩卖筹码（市场冰点），但历史证明，优质资产打折最狠的时候往往离黎明不远了。'
        : '企业赚钱变难加上市场缺钱，卖的人远多于买的人，接飞刀很容易受伤。';
    actionHint =
      temperature <= 25
        ? '别一次性梭哈，但可以开始分批小额定投宽基 ETF，悄悄捡打折的便宜货。'
        : '守住现金和国债避风港，耐心等待央行放水或盈利企稳信号。';
  } else if (composite <= -15) {
    regime = '弱势阴跌市';
    eli5Summary = '就像阴雨连绵的天气，缺乏赚钱效应，每次小反弹都容易被套牢盘砸下来。';
    actionHint = '降低高波动股票比例，提高红利、国债和现金占比。';
  }

  // 生成确定性的 24 期 K 线 + 成交量 + 5日均线，直观展现趋势与波动
  const candles = [];
  let price = 3000;
  const drift = composite * 0.65; // 每期趋势方向
  const volBase = 40 + Math.abs(sentiment) * 0.65; // 情绪越极端波动越大

  for (let i = 0; i < 24; i++) {
    // 确定性伪波动波形，保证同一参数下图表稳定可复现
    const wave =
      Math.sin(i * 1.15 + earnings * 0.03) * 0.65 +
      Math.cos(i * 0.72 + liquidity * 0.04) * 0.35;
    const open = price;
    const delta = drift + wave * volBase;
    const close = Math.max(1200, open + delta);
    const wickUp = Math.abs(Math.sin(i * 2.1 + 0.5)) * volBase * 0.6;
    const wickDown = Math.abs(Math.cos(i * 1.7 + 0.3)) * volBase * 0.6;
    const high = Math.max(open, close) + wickUp;
    const low = Math.max(1000, Math.min(open, close) - wickDown);
    const volume = Math.round(
      500 +
        Math.abs(delta) * 4.5 +
        Math.max(0, sentiment) * 3.5 +
        Math.abs(Math.sin(i * 1.4)) * 180
    );

    candles.push({
      index: i + 1,
      open: Math.round(open),
      close: Math.round(close),
      high: Math.round(high),
      low: Math.round(low),
      volume,
      isUp: close >= open
    });
    price = close;
  }

  // 计算 5 期均线（MA5）
  for (let i = 0; i < candles.length; i++) {
    const start = Math.max(0, i - 4);
    let sum = 0;
    for (let j = start; j <= i; j++) sum += candles[j].close;
    candles[i].ma5 = Math.round(sum / (i - start + 1));
  }

  const totalChangePct = +(
    ((candles[candles.length - 1].close - candles[0].open) / candles[0].open) *
    100
  ).toFixed(1);

  return {
    composite,
    temperature,
    bullPower,
    bearPower,
    regime,
    eli5Summary,
    actionHint,
    totalChangePct,
    candles
  };
}

/**
 * 4. 基金费率放大镜：主动高费率 vs 指数低费率
 */
function calcFundFeeDrag({
  initial = 100000,
  years = 15,
  grossReturnPct = 9,
  activeFeePct = 1.75, // 管理费1.2% + 托管费0.2% + 换手冲击等
  indexFeePct = 0.2, // 宽基 ETF 综合费率
  activeBuyFeePct = 1.5
}) {
  const gross = grossReturnPct / 100;
  const activeNetRate = gross - activeFeePct / 100;
  const indexNetRate = gross - indexFeePct / 100;

  const series = [];
  let noFeeVal = initial;
  let indexVal = initial * (1 - 0.0005); // 场内万分之五佣金
  let activeVal = initial * (1 - activeBuyFeePct / 100);

  for (let y = 0; y <= years; y++) {
    series.push({
      year: y,
      noFee: Math.round(noFeeVal),
      indexFund: Math.round(indexVal),
      activeFund: Math.round(activeVal)
    });
    noFeeVal *= 1 + gross;
    indexVal *= 1 + indexNetRate;
    activeVal *= 1 + activeNetRate;
  }

  const last = series[series.length - 1];
  const activeFeeLost = last.noFee - last.activeFund;
  const indexFeeLost = last.noFee - last.indexFund;
  const extraKeptByIndex = last.indexFund - last.activeFund;

  return {
    series,
    summary: {
      finalNoFee: last.noFee,
      finalIndex: last.indexFund,
      finalActive: last.activeFund,
      activeFeeLost,
      indexFeeLost,
      extraKeptByIndex,
      activeDragSharePct: last.noFee > initial ? +((activeFeeLost / (last.noFee - initial)) * 100).toFixed(1) : 0
    }
  };
}

/**

 */
function calcDcaSmileCurve({ scenario = 'smile', monthlyAmount = 1000 }) {
  // 24 个月的标准净值剧本（起点均为 1.00）
  const scripts = {

        0.68, 0.72, 0.76, 0.80, 0.84, 0.87, 0.90, 0.93, 0.95, 0.97, 0.99, 1.0
      ]
    },
    inverted: {

      desc: '开局顺风顺水大涨 45%，引诱大家高位不断加仓，最后又跌回起点，警示"要懂得高位止盈"！',
      prices: [

        1.24, 1.2, 1.16, 1.13, 1.1, 1.08, 1.06, 1.04, 1.03, 1.02, 1.01, 1.0

      desc: '真实股市最常见的健康走势：过程中有好几次吓人的回撤，但长期重心不断抬高。',
      prices: [
        1.0, 0.96, 1.02, 1.08, 1.03, 0.97, 1.05, 1.12, 1.16, 1.09, 1.06, 1.14,
        1.19, 1.15, 1.21, 1.26, 1.2, 1.18, 1.24, 1.28, 1.25, 1.3, 1.32, 1.35
      ]
    },
    deepBear: {
      name: '漫长深熊（从 1.0 跌到 0.65）',
      desc: '检验极端逆风情况：虽然市场跌了 35%，但定投如何靠摊低成本把亏损砍掉一半？',
      prices: [
        1.0, 0.96, 0.93, 0.89, 0.86, 0.84, 0.81, 0.78, 0.76, 0.74, 0.73, 0.71,
        0.7, 0.69, 0.68, 0.68, 0.67, 0.67, 0.66, 0.66, 0.66, 0.65, 0.65, 0.65
      ]
    }
  };

  const selected = scripts[scenario] || scripts.smile;
  const prices = selected.prices;
  const totalBudget = monthlyAmount * prices.length;

  let dcaShares = 0;
  let dcaInvested = 0;
  let smartShares = 0;
  let smartInvested = 0;
  const lumpShares = totalBudget / prices[0];

  const series = [];
  let dcaBreakevenMonth = null;

  for (let i = 0; i < prices.length; i++) {
    const p = prices[i];
    // 普通定投：每月固定买
    dcaShares += monthlyAmount / p;
    dcaInvested += monthlyAmount;
    const dcaValue = dcaShares * p;
    const dcaAvgCost = dcaInvested / dcaShares;

    // 智能低估定投：跌得多买1.5倍，涨得多只买0.5倍
    const mult = p <= 0.85 ? 1.5 : p >= 1.2 ? 0.5 : 1.0;
    const smartBuy = monthlyAmount * mult;
    smartShares += smartBuy / p;
    smartInvested += smartBuy;
    const smartValue = smartShares * p;

    const lumpValue = lumpShares * p;

    if (i > 4 && dcaBreakevenMonth === null && dcaValue >= dcaInvested && prices[i] < prices[0]) {
      dcaBreakevenMonth = i + 1;
    }

    series.push({
      month: i + 1,
      price: p,
      dcaAvgCost: +dcaAvgCost.toFixed(3),
      dcaReturnPct: +(((dcaValue - dcaInvested) / dcaInvested) * 100).toFixed(1),
      smartReturnPct: +(((smartValue - smartInvested) / smartInvested) * 100).toFixed(1),
      lumpReturnPct: +(((lumpValue - totalBudget) / totalBudget) * 100).toFixed(1),
      dcaValue: Math.round(dcaValue),
      dcaInvested: Math.round(dcaInvested),
      smartValue: Math.round(smartValue),
      smartInvested: Math.round(smartInvested),
      lumpValue: Math.round(lumpValue)
    });
  }

  const last = series[series.length - 1];
  return {
    meta: selected,
    series,
    summary: {
      finalPrice: prices[prices.length - 1],
      dcaAvgCost: last.dcaAvgCost,
      dcaInvested: last.dcaInvested,
      dcaValue: last.dcaValue,
      dcaReturnPct: last.dcaReturnPct,
      smartInvested: last.smartInvested,
      smartValue: last.smartValue,
      smartReturnPct: last.smartReturnPct,
      lumpInvested: totalBudget,
      lumpValue: last.lumpValue,
      lumpReturnPct: last.lumpReturnPct,
      dcaBreakevenMonth
    }
  };
}

/**
 * 6. 宏观水龙头与美林投资时钟计算
 */
function calcMacroClock({
  gdpGrowth = 5.0, // 经济增速 %（阈值 ~4.5%）
  cpiInflation = 2.0, // 物价通胀 %（阈值 ~3.0%）
  interestRate = 3.0 // 基准利率 %（中性 ~3.0%）
}) {
  const highGrowth = gdpGrowth >= 4.5;
  const highInflation = cpiInflation >= 3.0;

  let phase = 'recovery';
  let phaseName = '春季·复苏期';
  let bestAsset = '股票 / 宽基 ETF';
  let eli5Story =
    '经济开始热身加速，但物价还没涨起来，央行也乐意继续开着水龙头。企业利润噌噌涨、借钱又便宜，股市最爱这种春天！';

  // 各类资产顺风指数（0-100）
  let scores = { stocks: 88, bonds: 62, gold: 45, cash: 30 };

  if (highGrowth && highInflation) {
    phase = 'overheat';
    phaseName = '夏季·过热期';
    bestAsset = '大宗商品 / 黄金 / 资源股';
    eli5Story =
      '经济火热到发烫，大家抢东西把物价炒高了！央行不得不拧紧利率水龙头降温。这时候原材料和黄金最值钱，债券因为怕加息会挨打。';
    scores = { stocks: 64, bonds: 26, gold: 90, cash: 55 };
  } else if (!highGrowth && highInflation) {
    phase = 'stagflation';
    phaseName = '秋季·滞胀期';
    bestAsset = '现金（货币基金） + 黄金';
    eli5Story =
      '最难受的季节：东西越来越贵（通胀高），但大家生意不好做（经济慢）。股市和债市都头疼，拿着现金吃高利息+黄金抗通胀最稳妥！';
    scores = { stocks: 28, bonds: 38, gold: 80, cash: 88 };
  } else if (!highGrowth && !highInflation) {
    phase = 'recession';
    phaseName = '冬季·衰退期';
    bestAsset = '国债（债券基金）';
    eli5Story =
      '天气冷了，生意清淡、物价低迷。央行为了救经济会猛降利率放水！利率一降，手里提前买好的高息国债瞬间变成香饽饽，价格大涨。';
    scores = { stocks: 42, bonds: 92, gold: 66, cash: 52 };
  }

  // 利率跷跷板模拟（假设一张剩余 8 年期国债，基准中性利率 3%）
  const rateDelta = interestRate - 3.0;
  // 久期约 7 年：利率每降 1%，债价大约涨 7%
  const bondPrice = +(100 * (1 - rateDelta * 0.07)).toFixed(1);
  // 利率高低对股票估值乘数的影响
  const stockLiquidityEffect = Math.round(-rateDelta * 6);

  return {
    phase,
    phaseName,
    bestAsset,
    eli5Story,
    scores,
    bondPrice,
    stockLiquidityEffect,
    rateDelta: +rateDelta.toFixed(2)
  };
}

/**
 * 7. 资产配置与多情景压力测试回测
 */
function calcPortfolioBacktest({
  weights = { stocks: 50, bonds: 30, gold: 10, cash: 10 },
  initialCapital = 100000,
  rebalance = true
}) {
  // 归一化权重
  const sumW =
    (weights.stocks || 0) +
    (weights.bonds || 0) +
    (weights.gold || 0) +
    (weights.cash || 0);
  const norm =
    sumW > 0
      ? {
          stocks: (weights.stocks || 0) / sumW,
          bonds: (weights.bonds || 0) / sumW,
          gold: (weights.gold || 0) / sumW,
          cash: (weights.cash || 0) / sumW
        }
      : { stocks: 0.25, bonds: 0.25, gold: 0.25, cash: 0.25 };

  // 4 种典型 5 年历史风格剧本（每年各资产收益率 %）
  const scenarios = [
    {
      id: 'crashRecovery',
      name: '金融危机深V修复（先暴跌后反弹）',
      desc: '第1-2年股市腰斩、国债黄金护盘，第3-5年强力反弹。检验组合抗跌与再平衡威力！',
      years: [
        { stocks: -38, bonds: 11, gold: 16, cash: 3 },
        { stocks: -12, bonds: 6, gold: 14, cash: 2 },
        { stocks: 28, bonds: 2, gold: 8, cash: 2 },
        { stocks: 22, bonds: 3, gold: -4, cash: 2.5 },
        { stocks: 16, bonds: 4, gold: 5, cash: 2.5 }
      ]
    },
    {
      id: 'stagflation',
      name: '高通胀加息周期（股债承压）',
      desc: '物价飙升、央行持续加息，股票债券齐跌，黄金和现金发挥压舱石作用。',
      years: [
        { stocks: -18, bonds: -7, gold: 18, cash: 4 },
        { stocks: -10, bonds: -4, gold: 15, cash: 5 },
        { stocks: 6, bonds: 2, gold: 9, cash: 4.5 },
        { stocks: 14, bonds: 7, gold: 4, cash: 3.5 },
        { stocks: 12, bonds: 6, gold: 3, cash: 3 }
      ]
    },
    {
      id: 'techBull',
      name: '科技与经济大牛市',
      desc: '经济蓬勃发展、股市一路高歌猛进，检验进攻弹性。',
      years: [
        { stocks: 22, bonds: 3, gold: 4, cash: 2 },
        { stocks: 30, bonds: 1, gold: -2, cash: 2 },
        { stocks: -8, bonds: 5, gold: 7, cash: 2.5 },
        { stocks: 26, bonds: 2, gold: 5, cash: 2.5 },
        { stocks: 18, bonds: 3, gold: 3, cash: 2.5 }
      ]
    },
    {
      id: 'sideways',
      name: '五年宽幅震荡市（上下坐电梯）',
      desc: '股市涨一年跌一年原地踏步，看多元配置+每年再平衡如何悄悄赚出"再平衡红利"。',
      years: [
        { stocks: 24, bonds: -1, gold: -5, cash: 2.5 },
        { stocks: -22, bonds: 9, gold: 14, cash: 2.5 },
        { stocks: 20, bonds: 1, gold: -3, cash: 2.5 },
        { stocks: -18, bonds: 8, gold: 12, cash: 2.5 },
        { stocks: 16, bonds: 3, gold: 4, cash: 2.5 }
      ]
    }
  ];

  const results = scenarios.map((sc) => {
    let holdings = {
      stocks: initialCapital * norm.stocks,
      bonds: initialCapital * norm.bonds,
      gold: initialCapital * norm.gold,
      cash: initialCapital * norm.cash
    };
    let peak = initialCapital;
    let maxDrawdown = 0;
    const curve = [initialCapital];

    for (const yr of sc.years) {
      holdings.stocks *= 1 + yr.stocks / 100;
      holdings.bonds *= 1 + yr.bonds / 100;
      holdings.gold *= 1 + yr.gold / 100;
      holdings.cash *= 1 + yr.cash / 100;

      const total = holdings.stocks + holdings.bonds + holdings.gold + holdings.cash;
      curve.push(Math.round(total));
      if (total > peak) peak = total;
      const dd = ((peak - total) / peak) * 100;
      if (dd > maxDrawdown) maxDrawdown = dd;

      // 每年底自动再平衡：卖出涨太多的，补买跌便宜的
      if (rebalance) {
        holdings = {
          stocks: total * norm.stocks,
          bonds: total * norm.bonds,
          gold: total * norm.gold,
          cash: total * norm.cash
        };
      }
    }

    const finalValue = curve[curve.length - 1];
    const totalReturnPct = +(((finalValue - initialCapital) / initialCapital) * 100).toFixed(1);
    const cagrPct = +((Math.pow(finalValue / initialCapital, 1 / 5) - 1) * 100).toFixed(1);

    return {
      id: sc.id,
      name: sc.name,
      desc: sc.desc,
      curve,
      finalValue,
      totalReturnPct,
      cagrPct,
      maxDrawdownPct: +maxDrawdown.toFixed(1)
    };
  });

  // 风险画像判断
  const stockPct = Math.round(norm.stocks * 100);
  let profile = '稳健平衡型（攻守兼备）';
  if (stockPct >= 75) profile = '激进进取型（高弹性、需能承受大回撤）';
  else if (stockPct <= 25) profile = '保守防御型（睡得香、但长期增值较慢）';

  return {
    weightsPct: {
      stocks: Math.round(norm.stocks * 100),
      bonds: Math.round(norm.bonds * 100),
      gold: Math.round(norm.gold * 100),
      cash: Math.round(norm.cash * 100)
    },
    profile,
    results
  };
}

/**
 * 创建全新的 10 年模拟器状态
 */
function createSimState(initialCapital = 100000) {
  const prices = {};
  const holdings = {};
  for (const a of SIM_ASSETS) {
    prices[a.id] = 100;
    holdings[a.id] = 0; // 持有份额
  }

  return {
    quarterIndex: 0, // 0 表示尚未推进，当前看到 Q1 信息准备决策；推进到 40 表示结束
    finished: false,
    initialCapital,
    cash: initialCapital,
    quarterlySalary: 3000, // 每季度额外存下的可投资余钱（模拟真实打工族定投）
    totalDeposited: initialCapital,
    prices,
    holdings,
    autoDcaEnabled: true,
    autoDcaTarget: 'broadEtf',
    showEli5Advisor: true,
    tradeCount: 0,
    panicSellCount: 0,
    fomoBuyCount: 0,
    // 净值与基准历史记录
    history: [
      {
        label: '起点',
        portfolioValue: initialCapital,
        deposited: initialCapital,
        broadBenchmark: initialCapital,
        cashOnlyBenchmark: initialCapital,
        fomoXiaomingBenchmark: initialCapital
      }
    ],
    // 内部基准跟踪
    _benchBroadShares: initialCapital / 100,
    _benchCash: initialCapital,
    _xiaomingCash: initialCapital,
    _xiaomingBroadShares: 0,
    _xiaomingTechShares: 0
  };
}

/**
 * 计算当前组合总资产与各资产市值
 */
function getPortfolioSnapshot(state) {
  let invested = 0;
  const breakdown = {};
  for (const a of SIM_ASSETS) {
    const val = (state.holdings[a.id] || 0) * (state.prices[a.id] || 100);
    breakdown[a.id] = val;
    invested += val;
  }
  const totalValue = state.cash + invested;
  const totalProfit = totalValue - state.totalDeposited;
  const totalReturnPct =
    state.totalDeposited > 0 ? +((totalProfit / state.totalDeposited) * 100).toFixed(1) : 0;

  return {
    cash: state.cash,
    invested,
    totalValue,
    totalProfit,
    totalReturnPct,
    breakdown
  };
}

/**
 * 买入/卖出指定资产（按金额操作，对新手最友好）
 */
function tradeAsset(state, assetId, action, amount) {
  if (state.finished) return state;
  const price = state.prices[assetId];
  if (!price || amount <= 0) return state;

  const currentQuarter = MARKET_QUARTERS[Math.min(state.quarterIndex, MARKET_QUARTERS.length - 1)];

  if (action === 'buy') {
    const actualBuy = Math.min(state.cash, amount);
    if (actualBuy < 1) return state;
    state.cash -= actualBuy;
    state.holdings[assetId] = (state.holdings[assetId] || 0) + actualBuy / price;
    state.tradeCount += 1;
    // 记录追高行为（市场温度 >= 78 仍大买高风险股票类资产）
    if (currentQuarter && currentQuarter.temp >= 78 && (assetId === 'techEtf' || assetId === 'broadEtf')) {
      state.fomoBuyCount += 1;
    }
  } else if (action === 'sell') {
    const currentVal = (state.holdings[assetId] || 0) * price;
    const actualSell = Math.min(currentVal, amount);
    if (actualSell < 1) return state;
    state.holdings[assetId] = Math.max(0, (currentVal - actualSell) / price);
    state.cash += actualSell;
    state.tradeCount += 1;
    // 记录恐慌割肉行为（市场温度 <= 28 时卖出宽基或科技）
    if (currentQuarter && currentQuarter.temp <= 28 && (assetId === 'techEtf' || assetId === 'broadEtf')) {
      state.panicSellCount += 1;
    }
  }
  return state;
}

/**
 * 一键经典资产配置（新手省心工具：股债黄金现金一键配齐）
 */
function applyPresetAllocation(state, weights) {
  if (state.finished) return state;
  const snap = getPortfolioSnapshot(state);
  const total = snap.totalValue;
  let used = 0;

  for (const a of SIM_ASSETS) {
    const w = (weights[a.id] || 0) / 100;
    const targetVal = total * w;
    state.holdings[a.id] = targetVal / state.prices[a.id];
    used += targetVal;
  }
  state.cash = Math.max(0, total - used);
  state.tradeCount += 1;
  return state;
}

/**
 * 推进一个季度：执行定投、应用当季涨跌、更新三大基准曲线
 */
function advanceQuarter(state) {
  if (state.finished || state.quarterIndex >= MARKET_QUARTERS.length) {
    state.finished = true;
    return state;
  }

  const qData = MARKET_QUARTERS[state.quarterIndex];

  // 1. 发季度工资结余（模拟普通人持续储蓄）
  const salary = state.quarterlySalary;
  state.totalDeposited += salary;
  if (state.autoDcaEnabled && state.autoDcaTarget && state.prices[state.autoDcaTarget]) {
    state.holdings[state.autoDcaTarget] += salary / state.prices[state.autoDcaTarget];
  } else {
    state.cash += salary;
  }

  // 基准们同样收到这笔季度结余，保证绝对公平对比
  state._benchBroadShares += salary / state.prices.broadEtf;
  state._benchCash += salary;
  state._xiaomingCash += salary;

  // 反面教材"追涨杀跌小明"的典型行为：温度 > 70 追高买科技，温度 < 30 恐慌清仓割肉
  if (qData.temp >= 70 && state._xiaomingCash > 0) {
    state._xiaomingTechShares += (state._xiaomingCash * 0.85) / state.prices.techEtf;
    state._xiaomingCash *= 0.15;
  } else if (qData.temp <= 30) {
    state._xiaomingCash +=
      state._xiaomingTechShares * state.prices.techEtf +
      state._xiaomingBroadShares * state.prices.broadEtf;
    state._xiaomingTechShares = 0;
    state._xiaomingBroadShares = 0;
  } else if (qData.temp >= 55 && state._xiaomingCash > 10000) {
    state._xiaomingBroadShares += (state._xiaomingCash * 0.5) / state.prices.broadEtf;
    state._xiaomingCash *= 0.5;
  }

  // 2. 应用本季度市场价格涨跌幅与现金利息
  for (const a of SIM_ASSETS) {
    const pct = qData.returns[a.id] || 0;
    state.prices[a.id] = +(state.prices[a.id] * (1 + pct / 100)).toFixed(2);
  }
  const cashYield = (qData.returns.cash || 0.5) / 100;
  state.cash *= 1 + cashYield;
  state._benchCash *= 1 + cashYield;
  state._xiaomingCash *= 1 + cashYield;

  // 3. 记录历史快照
  const snap = getPortfolioSnapshot(state);
  const broadBenchmark = Math.round(state._benchBroadShares * state.prices.broadEtf);
  const cashOnlyBenchmark = Math.round(state._benchCash);
  const fomoXiaomingBenchmark = Math.round(
    state._xiaomingCash +
      state._xiaomingBroadShares * state.prices.broadEtf +
      state._xiaomingTechShares * state.prices.techEtf
  );

  state.history.push({
    label: qData.label,
    portfolioValue: Math.round(snap.totalValue),
    deposited: Math.round(state.totalDeposited),
    broadBenchmark,
    cashOnlyBenchmark,
    fomoXiaomingBenchmark
  });

  state.quarterIndex += 1;
  if (state.quarterIndex >= MARKET_QUARTERS.length) {
    state.finished = true;
  }

  return state;
}

/**
 * 生成 10 年毕业投资能力评估报告
 */
function generateGraduationReport(state) {
  const snap = getPortfolioSnapshot(state);
  const last = state.history[state.history.length - 1];

  // 计算最大回撤（相对净值峰值，剔除新存入资金干扰的净值近似：用收益率曲线或净值比）
  let peakRatio = 1;
  let maxDrawdownPct = 0;
  for (const h of state.history) {
    const ratio = h.portfolioValue / Math.max(1, h.deposited);
    if (ratio > peakRatio) peakRatio = ratio;
    const dd = ((peakRatio - ratio) / peakRatio) * 100;
    if (dd > maxDrawdownPct) maxDrawdownPct = dd;
  }

  const finalMultiple = snap.totalValue / Math.max(1, state.totalDeposited);
  // 近似年化收益（考虑分期投入的平均资金在场时间约 6.5 年）
  const effectiveYears = Math.max(1, (state.quarterIndex / 4) * 0.68);
  const approxAnnualizedPct = +(
    (Math.pow(Math.max(0.1, finalMultiple), 1 / effectiveYears) - 1) *
    100
  ).toFixed(1);

  const beatCash = snap.totalValue > last.cashOnlyBenchmark;
  const beatXiaoming = snap.totalValue > last.fomoXiaomingBenchmark;
  const beatBroad = snap.totalValue >= last.broadBenchmark * 0.98;

  // 综合评分（满分 100）
  let score = 55;
  if (beatCash) score += 15;
  if (beatXiaoming) score += 10;
  if (beatBroad) score += 10;
  if (maxDrawdownPct < 20) score += 10;
  else if (maxDrawdownPct > 35) score -= 8;
  score -= Math.min(12, state.panicSellCount * 4 + state.fomoBuyCount * 3);
  score = Math.max(30, Math.min(100, Math.round(score)));

  let badge = '🌱 成长中的理性学徒';
  let summary = '你完成了完整的十年经济周期长跑！复盘你在牛市顶峰和熊市冰点的操作，下一次你会更从容。';

  if (score >= 88) {
    badge = '🏆 穿越牛熊的资产配置大师';
    summary =
      '太惊艳了！你既吃到了经济增长与复利的大肉，又用多元配置和冷静纪律避开了泡沫与恐慌割肉，完美跑赢通胀与盲目散户！';
  } else if (score >= 75) {
    badge = '🧭 稳健理性的投资舵手';
    summary =
      '非常出色的表现！你懂得利用宽基 ETF、债券与黄金分散风险，已经远远超越了市场上大多数追涨杀跌的投资者。';
  } else if (!beatCash) {
    badge = '🛡️ 过度保守的存钱守护者';
    summary =
      '你很看重本金安全，没亏钱，但因为长期把太多资金闲置在现金里或在低点割肉，没能充分享受到复利和经济增长红利。';
  }

  return {
    score,
    badge,
    summary,
    finalValue: Math.round(snap.totalValue),
    totalDeposited: Math.round(state.totalDeposited),
    totalProfit: Math.round(snap.totalProfit),
    totalReturnPct: snap.totalReturnPct,
    approxAnnualizedPct,
    maxDrawdownPct: +maxDrawdownPct.toFixed(1),
    broadBenchmark: last.broadBenchmark,
    cashOnlyBenchmark: last.cashOnlyBenchmark,
    fomoXiaomingBenchmark: last.fomoXiaomingBenchmark,
    beatCash,
    beatXiaoming,
    beatBroad,
    panicSellCount: state.panicSellCount,
    fomoBuyCount: state.fomoBuyCount
  };
}

/**
 * 自研零依赖响应式 SVG 图表组件库
 * 专门针对投资教学优化：清晰坐标轴、数值标签、平滑网格、自动适配浅色/深色与红涨绿跌主题
 */

function formatShortNum(n) {
  if (Math.abs(n) >= 100000000) return (n / 100000000).toFixed(1) + '亿';
  if (Math.abs(n) >= 10000) return (n / 10000).toFixed(1) + '万';
  return String(Math.round(n));
}

/**
 * 通用多折线/面积对比图
 * @param {Object} opts
 * @param {string[]} opts.labels X轴标签
 * @param {Array<{name:string, color:string, values:number[], dashed?:boolean, fill?:boolean}>} opts.series
 * @param {number} [opts.height=240]
 * @param {Function} [opts.valueFormatter]
 */
function renderLineChart({
  labels,
  series,
  height = 240,
  valueFormatter = formatShortNum,
  zeroLine = false
}) {
  const width = 680;
  const padL = 56;
  const padR = 20;
  const padT = 18;
  const padB = 34;
  const plotW = width - padL - padR;
  const plotH = height - padT - padB;

  const allVals = series.flatMap((s) => s.values);
  if (zeroLine) allVals.push(0);
  let minV = Math.min(...allVals);
  let maxV = Math.max(...allVals);
  if (minV === maxV) {
    minV -= 1;
    maxV += 1;
  }
  const padRange = (maxV - minV) * 0.08;
  minV -= padRange;
  maxV += padRange;

  const count = Math.max(1, labels.length);
  const xOf = (i) => padL + (count === 1 ? plotW / 2 : (i / (count - 1)) * plotW);
  const yOf = (v) => padT + plotH - ((v - minV) / (maxV - minV)) * plotH;

  // 水平网格线（5 条）
  let gridSvg = '';
  for (let i = 0; i <= 4; i++) {
    const ratio = i / 4;
    const val = maxV - ratio * (maxV - minV);
    const y = padT + ratio * plotH;
    gridSvg += `
      <line x1="${padL}" y1="${y.toFixed(1)}" x2="${width - padR}" y2="${y.toFixed(1)}"
            stroke="var(--border-color)" stroke-dasharray="3 3" stroke-width="1" />
      <text x="${padL - 8}" y="${(y + 4).toFixed(1)}" text-anchor="end"
            fill="var(--text-muted)" font-size="11" font-family="var(--font-mono)">${valueFormatter(val)}</text>
    `;
  }

  // 零轴强调线
  let zeroSvg = '';
  if (zeroLine && minV < 0 && maxV > 0) {
    const zy = yOf(0);
    zeroSvg = `<line x1="${padL}" y1="${zy.toFixed(1)}" x2="${width - padR}" y2="${zy.toFixed(1)}" stroke="var(--text-muted)" stroke-width="1.2" />`;
  }

  // X 轴稀疏标签（最多显示 7 个，防止拥挤）
  let xLabelsSvg = '';
  const step = Math.max(1, Math.ceil(count / 6));
  for (let i = 0; i < count; i += step) {
    const x = xOf(i);
    xLabelsSvg += `<text x="${x.toFixed(1)}" y="${height - 10}" text-anchor="middle" fill="var(--text-muted)" font-size="11">${labels[i]}</text>`;
  }
  if ((count - 1) % step !== 0 && count > 1) {
    const x = xOf(count - 1);
    xLabelsSvg += `<text x="${x.toFixed(1)}" y="${height - 10}" text-anchor="middle" fill="var(--text-muted)" font-size="11">${labels[count - 1]}</text>`;
  }

  // 折线与面积
  let linesSvg = '';
  for (const s of series) {
    if (!s.values.length) continue;
    const pts = s.values.map((v, i) => `${xOf(i).toFixed(1)},${yOf(v).toFixed(1)}`).join(' ');
    if (s.fill) {
      const areaPts = `${xOf(0).toFixed(1)},${(padT + plotH).toFixed(1)} ${pts} ${xOf(s.values.length - 1).toFixed(1)},${(padT + plotH).toFixed(1)}`;
      linesSvg += `<polygon points="${areaPts}" fill="${s.color}" fill-opacity="0.11" />`;
    }
    linesSvg += `
      <polyline points="${pts}" fill="none" stroke="${s.color}"
                stroke-width="${s.dashed ? 2 : 2.8}"
                ${s.dashed ? 'stroke-dasharray="6 4"' : ''}
                stroke-linecap="round" stroke-linejoin="round" />
    `;
    // 末端圆点与数值气泡
    const lastIdx = s.values.length - 1;
    const lx = xOf(lastIdx);
    const ly = yOf(s.values[lastIdx]);
    linesSvg += `<circle cx="${lx.toFixed(1)}" cy="${ly.toFixed(1)}" r="4" fill="${s.color}" stroke="var(--bg-surface)" stroke-width="2" />`;
  }

  const legendHtml = series
    .map(
      (s) =>
        `<span class="legend-item"><span class="legend-dot" style="background:${s.color}"></span>${s.name}</span>`
    )
    .join('');

  return `
    <div class="chart-wrap">
      <div class="chart-legend">${legendHtml}</div>
      <svg viewBox="0 0 ${width} ${height}" width="100%" style="display:block;height:auto;">
        ${gridSvg}
        ${zeroSvg}
        ${xLabelsSvg}
        ${linesSvg}
      </svg>
    </div>
  `;
}

/**
 * K 线 + 5日均线 + 成交量综合图（自动响应红涨绿跌 / 绿涨红跌 CSS 变量）
 */
function renderCandlestickChart(candles) {
  const width = 680;
  const height = 270;
  const padL = 52;
  const padR = 16;
  const padT = 16;
  const priceH = 165;
  const volTop = padT + priceH + 20;
  const volH = 52;
  const plotW = width - padL - padR;

  const minP = Math.min(...candles.map((c) => c.low)) * 0.985;
  const maxP = Math.max(...candles.map((c) => c.high)) * 1.015;
  const maxVol = Math.max(...candles.map((c) => c.volume), 1);

  const stepW = plotW / candles.length;
  const barW = Math.max(5, Math.min(14, stepW * 0.58));

  const yPrice = (p) => padT + priceH - ((p - minP) / Math.max(1, maxP - minP)) * priceH;

  let gridSvg = '';
  for (let i = 0; i <= 3; i++) {
    const val = maxP - (i / 3) * (maxP - minP);
    const y = padT + (i / 3) * priceH;
    gridSvg += `
      <line x1="${padL}" y1="${y.toFixed(1)}" x2="${width - padR}" y2="${y.toFixed(1)}" stroke="var(--border-color)" stroke-dasharray="3 3" />
      <text x="${padL - 8}" y="${(y + 4).toFixed(1)}" text-anchor="end" fill="var(--text-muted)" font-size="10.5" font-family="var(--font-mono)">${Math.round(val)}</text>
    `;
  }

  let barsSvg = '';
  const maPts = [];

  candles.forEach((c, idx) => {
    const cx = padL + idx * stepW + stepW / 2;
    const color = c.isUp ? 'var(--market-up)' : 'var(--market-down)';
    const yHigh = yPrice(c.high);
    const yLow = yPrice(c.low);
    const yOpen = yPrice(c.open);
    const yClose = yPrice(c.close);
    const bodyTop = Math.min(yOpen, yClose);
    const bodyH = Math.max(2, Math.abs(yClose - yOpen));

    // 上下影线与实体
    barsSvg += `
      <line x1="${cx.toFixed(1)}" y1="${yHigh.toFixed(1)}" x2="${cx.toFixed(1)}" y2="${yLow.toFixed(1)}" stroke="${color}" stroke-width="1.5" />
      <rect x="${(cx - barW / 2).toFixed(1)}" y="${bodyTop.toFixed(1)}" width="${barW.toFixed(1)}" height="${bodyH.toFixed(1)}" fill="${color}" rx="1.5" />
    `;

    // 成交量柱
    const vh = (c.volume / maxVol) * volH;
    barsSvg += `
      <rect x="${(cx - barW / 2).toFixed(1)}" y="${(volTop + volH - vh).toFixed(1)}" width="${barW.toFixed(1)}" height="${vh.toFixed(1)}" fill="${color}" fill-opacity="0.45" rx="1" />
    `;

    maPts.push(`${cx.toFixed(1)},${yPrice(c.ma5).toFixed(1)}`);
  });

  const maLine = `<polyline points="${maPts.join(' ')}" fill="none" stroke="#f59e0b" stroke-width="2.2" stroke-linejoin="round" />`;

  return `
    <div class="chart-wrap">
      <div class="chart-legend">
        <span class="legend-item"><span class="legend-dot" style="background:var(--market-up)"></span>阳线（买方占优）</span>
        <span class="legend-item"><span class="legend-dot" style="background:var(--market-down)"></span>阴线（卖方占优）</span>
        <span class="legend-item"><span class="legend-dot" style="background:#f59e0b"></span>5期均线 (MA5 趋势线)</span>
        <span class="legend-item" style="margin-left:auto;color:var(--text-muted)">下方柱子 = 成交量</span>
      </div>
      <svg viewBox="0 0 ${width} ${height}" width="100%" style="display:block;height:auto;">
        ${gridSvg}
        <text x="${padL - 8}" y="${volTop + 12}" text-anchor="end" fill="var(--text-muted)" font-size="10">成交量</text>
        ${barsSvg}
        ${maLine}
      </svg>
    </div>
  `;
}

/**
 * 环形资产占比图（SVG Donut）
 */
function renderDonutChart(items) {
  const size = 180;
  const cx = 90;
  const cy = 90;
  const r = 64;
  const circ = 2 * Math.PI * r;
  const total = items.reduce((s, x) => s + Math.max(0, x.value), 0) || 1;

  let offset = 0;
  const segments = items
    .filter((x) => x.value > 0)
    .map((item) => {
      const frac = item.value / total;
      const dash = frac * circ;
      const seg = `
        <circle cx="${cx}" cy="${cy}" r="${r}" fill="none"
                stroke="${item.color}" stroke-width="22"
                stroke-dasharray="${dash.toFixed(2)} ${(circ - dash).toFixed(2)}"
                stroke-dashoffset="${(-offset).toFixed(2)}"
                transform="rotate(-90 ${cx} ${cy})" />
      `;
      offset += dash;
      return seg;
    })
    .join('');

  const legend = items
    .map((x) => {
      const pct = Math.round((Math.max(0, x.value) / total) * 100);
      return `
        <div style="display:flex;align-items:center;justify-content:space-between;font-size:13px;padding:4px 0;">
          <span class="legend-item"><span class="legend-dot" style="background:${x.color}"></span>${x.label}</span>
          <strong style="font-family:var(--font-mono)">${pct}%</strong>
        </div>
      `;
    })
    .join('');

  return `
    <div style="display:flex;align-items:center;gap:20px;flex-wrap:wrap;justify-content:center;">
      <svg viewBox="0 0 ${size} ${size}" width="160" height="160" style="flex-shrink:0;">
        <circle cx="${cx}" cy="${cy}" r="${r}" fill="none" stroke="var(--border-color)" stroke-width="22" />
        ${segments}
        <text x="${cx}" y="${cy - 4}" text-anchor="middle" fill="var(--text-muted)" font-size="11">资产配置</text>
        <text x="${cx}" y="${cy + 14}" text-anchor="middle" fill="var(--text-primary)" font-size="14" font-weight="800">100%</text>
      </svg>
      <div style="flex:1;min-width:160px;">${legend}</div>
    </div>
  `;
}

            <span class="text-up">买方(多头) ${res.bullPower}%</span>
            <span class="text-down">卖方(空头) ${res.bearPower}%</span>

            <div style="width:${res.bearPower}%;background:var(--market-down);"></div>

      ${chartHtml}

        <div class="eli5-box-title">🎙️ 天气预报员 ELI5 解读</div>
        <p style="margin:0 0 6px;font-size:14px;">${res.eli5Summary}</p>
        <p style="margin:0;font-size:13.5px;font-weight:700;color:var(--brand);">👉 应对思路：${res.actionHint}</p>
      </div>
    `;
  };

  container.querySelectorAll('input[type="range"]').forEach((el) => {
    el.addEventListener('input', (e) => {
      state[e.target.dataset.k] = Number(e.target.value);
      notify();
      update();
    });
  });
  container.querySelectorAll('[data-preset]').forEach((btn) => {
    btn.addEventListener('click', () => {
      const p = presets[Number(btn.dataset.preset)];
      Object.assign(state, p.v);
      for (const [k, val] of Object.entries(p.v)) {
        const input = container.querySelector(`input[data-k="${k}"]`);
        if (input) input.value = String(val);
      }
      notify();
      update();
    });
  });
  update();
}

        </div>
        <div class="stat-card">
          <div class="stat-label">智能低估定投（跌深买1.5倍）</div>
          <div class="stat-value">${fmtRet(s.smartReturnPct)}</div>
          <div class="stat-sub">投入 ${fmtYuan(s.smartInvested)} → 市值 ${fmtYuan(s.smartValue)}</div>

              : state.scenario === 'inverted'
              ? '警惕！如果先大涨后跌回原价，定投在山顶买了很多贵筹码，最后反而是亏钱的！所以定投不是无脑永久不卖，<strong>山顶过热时要分批止盈</strong>！'
              : state.scenario === 'volatileUp'
              ? '在单边慢牛中，因为前期价格便宜，期初一把梭哈总收益最高；但普通打工族本来就没有期初一大笔钱，定投依然稳稳斩获了丰厚正收益！'

          }

      </div>

  container.querySelectorAll('[data-sc]').forEach((b) => {
    b.addEventListener('click', () => {

      notify();

  });
  container.querySelector('#dca-amt')?.addEventListener('input', (e) => {
    state.monthlyAmount = Number(e.target.value);
    notify();
    update();
  });
  update();
}

function mountPortfolioLab(container, notify) {
  const state = { stocks: 50, bonds: 30, gold: 10, cash: 10, rebalance: true };
  const presets = [
    { name: '⚡ 激进满仓股 (95/0/0/5)', v: { stocks: 95, bonds: 0, gold: 0, cash: 5 } },
    { name: '⚖️ 经典股债平衡 (60/30/5/5)', v: { stocks: 60, bonds: 30, gold: 5, cash: 5 } },
    { name: '🛡️ 达利欧全天候 (35/45/15/5)', v: { stocks: 35, bonds: 45, gold: 15, cash: 5 } },
    { name: '🐢 稳健防跌型 (20/55/10/15)', v: { stocks: 20, bonds: 55, gold: 10, cash: 15 } }
  ];

  container.innerHTML = `
    <div class="lab-panel">
      <div class="lab-header">
        <div>
          <span class="lab-badge">🧪 互动实验室 7</span>
          <h3 style="margin:6px 0 4px;">🧺 个人资产配置搭配师 & 极端行情压力测试</h3>
          <p style="margin:0;font-size:13.5px;color:var(--text-secondary);">自由调配四类资产权重（自动折算 100%），用 ¥100,000 一键在四大极端 5 年历史剧本里压力测试！</p>
        </div>
        <div style="display:flex;gap:6px;flex-wrap:wrap;">
          ${presets.map((p, idx) => `<button class="btn btn-outline btn-sm" data-preset="${idx}">${p.name}</button>`).join('')}

      </div>

      <div class="grid-2" style="align-items:center;margin-bottom:18px;">
        <div>
          <div class="control-group">
            <div class="control-label"><span>🚀 股票 / 宽基 ETF 权重</span><span class="control-value" data-val="stocks"></span></div>
            <input type="range" data-k="stocks" min="0" max="100" step="5" value="${state.stocks}">
          </div>
          <div class="control-group">
            <div class="control-label"><span>🛡️ 国债 / 纯债基金 权重</span><span class="control-value" data-val="bonds"></span></div>
            <input type="range" data-k="bonds" min="0" max="100" step="5" value="${state.bonds}">
          </div>
          <div class="control-group">
            <div class="control-label"><span>🪙 黄金 ETF 权重</span><span class="control-value" data-val="gold"></span></div>
            <input type="range" data-k="gold" min="0" max="100" step="5" value="${state.gold}">
          </div>
          <div class="control-group">
            <div class="control-label"><span>💵 现金 / 货币基金 权重</span><span class="control-value" data-val="cash"></span></div>
            <input type="range" data-k="cash" min="0" max="100" step="5" value="${state.cash}">
          </div>
          <label style="display:flex;align-items:center;gap:8px;font-size:13.5px;font-weight:700;cursor:pointer;margin-top:8px;">
            <input type="checkbox" id="rebal-chk" ${state.rebalance ? 'checked' : ''} style="width:16px;height:16px;">
            开启「每年底自动动态再平衡」（自动高抛低吸恢复原比例）
          </label>
        </div>
        <div id="port-donut"></div>
      </div>

      <div id="lab-output"></div>
    </div>
  `;

  const output = container.querySelector('#lab-output');
  const donutBox = container.querySelector('#port-donut');

  const update = () => {
    const res = calcPortfolioBacktest({
      weights: { stocks: state.stocks, bonds: state.bonds, gold: state.gold, cash: state.cash },
      rebalance: state.rebalance
    });
    const w = res.weightsPct;

    container.querySelector('[data-val="stocks"]').textContent = `${w.stocks}%`;
    container.querySelector('[data-val="bonds"]').textContent = `${w.bonds}%`;
    container.querySelector('[data-val="gold"]').textContent = `${w.gold}%`;
    container.querySelector('[data-val="cash"]').textContent = `${w.cash}%`;

    donutBox.innerHTML = `
      ${renderDonutChart([
        { label: '股票 / 宽基 ETF', value: w.stocks, color: '#4f46e5' },
        { label: '国债 / 纯债基金', value: w.bonds, color: '#059669' },
        { label: '黄金 ETF', value: w.gold, color: '#d97706' },
        { label: '现金 / 货币基金', value: w.cash, color: '#64748b' }
      ])}
      <div style="text-align:center;margin-top:12px;font-size:13px;font-weight:700;color:var(--brand);">
        当前组合风格：${res.profile}
      </div>
    `;

    output.innerHTML = `
      <div class="grid-2">
        ${res.results
          .map(
            (r) => `
          <div class="stat-card" style="background:var(--bg-surface);">
            <div style="font-weight:800;font-size:14px;margin-bottom:4px;">${r.name}</div>
            <div style="font-size:12px;color:var(--text-muted);margin-bottom:10px;">${r.desc}</div>
            <div style="display:flex;justify-content:space-between;align-items:baseline;flex-wrap:wrap;gap:8px;">
              <div>
                <div class="stat-label">5 年后最终资产</div>
                <div class="stat-value" style="font-size:18px;">${fmtYuan(r.finalValue)}</div>
              </div>
              <div>
                <div class="stat-label">总收益 / 年化</div>
                <div style="font-family:var(--font-mono);font-weight:800;font-size:14px;" class="${r.totalReturnPct >= 0 ? 'text-up' : 'text-down'}">
                  ${r.totalReturnPct >= 0 ? '+' : ''}${r.totalReturnPct}% (${r.cagrPct >= 0 ? '+' : ''}${r.cagrPct}%/年)
                </div>
              </div>
              <div>
                <div class="stat-label">最大回撤（最惨浮亏）</div>
                <div style="font-family:var(--font-mono);font-weight:800;font-size:14px;color:${r.maxDrawdownPct > 25 ? 'var(--danger)' : 'var(--success)'};">
                  -${r.maxDrawdownPct}%
                </div>
              </div>
            </div>
          </div>
        `
          )
          .join('')}
      </div>
    `;
  };

  container.querySelectorAll('input[type="range"]').forEach((el) => {
    el.addEventListener('input', (e) => {
      state[e.target.dataset.k] = Number(e.target.value);
      notify();
      update();
    });
  });
  container.querySelector('#rebal-chk')?.addEventListener('change', (e) => {
    state.rebalance = e.target.checked;
    notify();
    update();
  });
  container.querySelectorAll('[data-preset]').forEach((btn) => {
    btn.addEventListener('click', () => {
      const p = presets[Number(btn.dataset.preset)];
      Object.assign(state, p.v);
      for (const [k, val] of Object.entries(p.v)) {
        const input = container.querySelector(`input[data-k="${k}"]`);
        if (input) input.value = String(val);
      }
      notify();
      update();
    });
  });
  update();
}

        const amt = btn.dataset.amt === 'all' ? 999999999 : Number(btn.dataset.amt);
        tradeAsset(sharedSimState, id, action, amt);
        render();
      });
    });

    const presetMap = {
      balanced: { broadEtf: 40, techEtf: 0, dividend: 15, bondEtf: 25, goldEtf: 10 },

      btn.addEventListener('click', () => {
        applyPresetAllocation(sharedSimState, presetMap[btn.dataset.alloc]);
        render();
      });
    });
  };

  render();
}

  { minXp: 0, title: 'Lv.0 金融萌新', nextXp: 150 },
  { minXp: 150, title: 'Lv.1 理财学徒', nextXp: 350 },

function loadProgress() {
  try {
    const raw = localStorage.getItem(STORAGE_KEY);
    if (raw) {
      const parsed = JSON.parse(raw);
      return {
        completedLessons: parsed.completedLessons || [],
        triedLabs: parsed.triedLabs || [],
        xp: parsed.xp || 0,
        sandboxGraduated: Boolean(parsed.sandboxGraduated),
        theme: parsed.theme || 'light',
        marketColor: parsed.marketColor || 'cn' // 'cn' 红涨绿跌 | 'global' 绿涨红跌
      };
    }
  } catch {
    // 忽略隐私模式存储异常
  }
  return {
    completedLessons: [],
    triedLabs: [],
    xp: 0,
    sandboxGraduated: false,
    theme: 'light',
    marketColor: 'cn'
  };
}

function saveProgress(prog) {
  try {
    localStorage.setItem(STORAGE_KEY, JSON.stringify(prog));

    // 忽略存储异常
  }
}

/**
 * 将正文中 **加粗** 与 [[glossaryId|显示文字]] 渲染为安全的交互 HTML
 */
function renderRichEli5Text(text) {
  if (!text) return '';
  let html = String(text)
    .replace(/&/g, '&amp;')
    .replace(/</g, '&lt;')
    .replace(/>/g, '&gt;');

  // 加粗语法
  html = html.replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>');

  // 术语胶囊 [[id|label]]
  html = html.replace(/\[\[([a-zA-Z0-9_-]+)\|([^\]]+)\]\]/g, (_, id, label) => {
    if (GLOSSARY[id]) {
      return `<span class="glossary-term" role="button" tabindex="0" data-glossary="${id}" title="点击查看 5 岁大白话解释">${label}</span>`;
    }
    return `<strong>${label}</strong>`;
  });

  return html;
}

function getRank(xp) {
  let current = RANKS[0];
  for (const r of RANKS) {
    if (xp >= r.minXp) current = r;
  }
  return current;
}
